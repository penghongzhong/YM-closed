name: YM original24 true lattice-link Wilson loops — strict Lean audit
on:
  push:
    branches: [ym-original24-link-wilson-20261030]
    paths:
      - "YMOriginal/Original24_ActualLatticeLinks.lean"
      - "YMOriginal/Original24_TwoExternalWilsonRoots.lean"
      - "YMOriginal/Original24_TwoRootFullRadius.lean"
      - "YMOriginal/Original24_TwoRootOldNewU1.lean"
      - "YMOriginal/Original24_FixedLinkSupport.lean"
      - "YMOriginal/Original30_JointLatticeSchwartz.lean"
      - "YMOriginal/Original30_FixedBoxJointHierarchy.lean"
      - "YMOriginal/Original30_WilsonProbabilityMoments.lean"
      - ".github/workflows/ym-physical-wilson-links.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  link-based-su2-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          source "$HOME/.elan/env"
          lean --version
      - name: Lock Mathlib and load Lean artifacts
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Build actual link-based Wilson source
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YMOriginal/Original24_ActualLatticeLinks.lean; then exit 1; fi
          lake build +YMOriginal.Original24_TwoRootOldNewU1:olean +YMOriginal.Original24_FixedLinkSupport:olean +YMOriginal.Original30_FixedBoxJointHierarchy:olean +YMOriginal.Original30_WilsonProbabilityMoments:olean
      - name: Check exact statements and axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cat > ActualLatticeLinksAudit.lean <<'LEAN'
          import YMOriginal.Original24_ActualLatticeLinks
          import YMOriginal.Original24_TwoExternalWilsonRoots
          import YMOriginal.Original24_TwoRootFullRadius
          import YMOriginal.Original24_TwoRootOldNewU1
          import YMOriginal.Original24_FixedLinkSupport
          import YMOriginal.Original30_JointLatticeSchwartz
          import YMOriginal.Original30_FixedBoxJointHierarchy
          import YMOriginal.Original30_WilsonProbabilityMoments
          #print YMUIC.Original24.actual_link_walk_support_radius
          #print YMUIC.Original24.actual_fixed_word_support_radius
          #print YMUIC.Original24.actual_two_fixed_wilson_root_support_separation
          #print YMUIC.Original24.actual_wilson_word_insertion_full_radius
          #print YMUIC.Original24.actual_two_root_insertion_full_radius
          #print YMUIC.Original24.actual_two_root_full_radius_rooted_tree
          #print YMUIC.Original24.actual_two_root_old_new_r_full_radius
          #print YMUIC.Original24.actual_two_root_mixed_subtraction
          #print YMUIC.Original24.actual_two_root_insertion_small
          #print YMUIC.Original24.actual_two_root_marked_tree_sum
          #print YMUIC.Original24.actual_two_link_root_gauge_invariant
          #print YMUIC.Original30.actual_word_joint_probability_integrable_and_bound
          #print YMUIC.Original30.actual_word_joint_distribution_apply
          #print YMUIC.Original30.actual_word_physical_box_OS_E0prime
          #print YMUIC.Original30.actual_word_joint_cutoff_schwartz_bound
          #print YMUIC.Original30.actual_word_joint_physical_box_bound
          #print YMUIC.Original24.actual_walk_gauge_transport
          #print YMUIC.Original24.actual_closed_link_walk_conjugacy
          #print YMUIC.Original24.actual_closed_wilson_root_gauge_invariant
          #print YMUIC.Original24.actual_link_wilson_polynomial_gauge_invariant
          #print axioms YMUIC.Original24.actual_link_walk_support_radius
          #print axioms YMUIC.Original24.actual_fixed_word_support_radius
          #print axioms YMUIC.Original24.actual_two_fixed_wilson_root_support_separation
          #print axioms YMUIC.Original24.actual_wilson_word_insertion_full_radius
          #print axioms YMUIC.Original24.actual_two_root_insertion_full_radius
          #print axioms YMUIC.Original24.actual_two_root_full_radius_rooted_tree
          #print axioms YMUIC.Original24.actual_two_root_old_new_r_full_radius
          #print axioms YMUIC.Original24.actual_two_root_mixed_subtraction
          #print axioms YMUIC.Original24.actual_two_root_insertion_small
          #print axioms YMUIC.Original24.actual_two_root_marked_tree_sum
          #print axioms YMUIC.Original24.actual_two_link_root_gauge_invariant
          #print axioms YMUIC.Original30.actual_word_joint_probability_integrable_and_bound
          #print axioms YMUIC.Original30.joint_schwartz_eval_clm_apply
          #print axioms YMUIC.Original30.actual_word_joint_distribution_apply
          #print axioms YMUIC.Original30.actual_word_physical_box_OS_E0prime
          #print axioms YMUIC.Original30.actual_word_joint_cutoff_schwartz_bound
          #print axioms YMUIC.Original30.actual_word_joint_physical_box_bound
          #print axioms YMUIC.Original24.actual_walk_gauge_transport
          #print axioms YMUIC.Original24.actual_closed_link_walk_conjugacy
          #print axioms YMUIC.Original24.actual_closed_wilson_root_gauge_invariant
          #print axioms YMUIC.Original24.actual_link_wilson_polynomial_gauge_invariant
          LEAN
          lake env lean -DwarningAsError=true ActualLatticeLinksAudit.lean | tee actual-lattice-links-audit.log
          if grep -E 'sorryAx|^error:' actual-lattice-links-audit.log; then exit 1; fi
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-lattice-links-${{ github.sha }}
          path: actual-lattice-links-audit.log
          if-no-files-found: warn
          retention-days: 30
