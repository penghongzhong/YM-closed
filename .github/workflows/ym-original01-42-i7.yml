name: YM Original01 U1 official pin

on:
  push:
    branches: [ym-original01-42-i7-conditional-20261030]
    paths:
      - ".github/workflows/ym-original01-42-i7.yml"
      - "YMOriginal/**"
      - "Lean/Section02/T001_U1_PublishedInterface.lean"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-environments:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Lean 4.35
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Retrieve pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
          # The pinned mathlib release has one noncached OLean target; Lake fills it.
          lake build +YM.Wilson.RootBound:olean
      - name: Original01 unchanged external theorem typecheck
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' Lean/Section02/T001_U1_PublishedInterface.lean; then exit 1; fi
          { cat Lean/Section02/T001_U1_PublishedInterface.lean
            echo '#print YMUICV128.Section02.u1_exact_interface_use'
            echo '#print axioms YMUICV128.Section02.u1_exact_interface_use'
          } > Original01Audit.lean
          lake env lean -DwarningAsError=true Original01Audit.lean | tee original01-audit.log
          if grep -E 'sorryAx|^error:' original01-audit.log; then exit 1; fi
      - name: Preserve strict proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original01-u1-${{ github.sha }}
          path: original01-audit.log
          if-no-files-found: warn
          retention-days: 30
