name: YM Original30 actual SU2 Wilson Schwartz source
on:
  push:
    branches: [ym-c30-wilson-source-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wilson-schwartz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fixed Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Pinned Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Compile actual SU2 root and Schwartz source
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YM/Wilson/RootBound.lean PublicC30/WilsonPlaquetteSmearing.lean; then exit 1; fi
          lake build +PublicC30.WilsonPlaquetteSmearing:olean
          lake env lean -DwarningAsError=true YM/Wilson/RootBound.lean
          lake env lean -DwarningAsError=true PublicC30/WilsonPlaquetteSmearing.lean
      - name: Full theorem type and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/wilson-schwartz
          cat >verification/wilson-schwartz/Audit.lean <<'LEAN'
          import PublicC30.WilsonPlaquetteSmearing
          set_option pp.universes true
          #print YMUIC.OSTensor.wilsonPlaquetteSchwartzSmear
          #print YMUIC.OSTensor.wilsonPlaquetteSchwartz_finite_bound
          #print YMUIC.OSTensor.wilsonPlaquetteSchwartz_uniform_bound
          #print axioms YMUICV128.Section03.wilsonRoot_bounds
          #print axioms YMUIC.OSTensor.wilsonPlaquetteSchwartz_term_bound
          #print axioms YMUIC.OSTensor.wilsonPlaquetteSchwartz_finite_bound
          #print axioms YMUIC.OSTensor.wilsonPlaquetteSchwartz_uniform_bound
          LEAN
          lake env lean -DwarningAsError=true verification/wilson-schwartz/Audit.lean | tee verification/wilson-schwartz/audit.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/wilson-schwartz/audit.log; then exit 1; fi
      - name: Upload exact verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-wilson-schwartz-${{ github.sha }}
          path: verification/wilson-schwartz/audit.log
          if-no-files-found: warn
          retention-days: 30
