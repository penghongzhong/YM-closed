name: YM UIC synchronized verification
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ym-uic-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean-logical-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Resolve pinned Mathlib and cache
        run: |
          lake update
          lake exe cache get
      - name: Raw compile every Lean file and audit axioms
        id: raw
        continue-on-error: true
        run: lake env python3 tools/verify_lean.py
      - name: Require full repository batch
        if: always()
        run: |
          test "${{ steps.raw.outcome }}" = "success"
          python3 -c 'import json; r=json.load(open(".lean-verify/result.json")); assert r["files"] and r["pass"]; print("FINAL_GATE=SUCCESS")'
