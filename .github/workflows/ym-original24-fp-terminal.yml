name: YM Original24 terminal connected Ursell--FP (Lean 4.35 strict)

on:
  push:
    branches: [ym-original24-fp-terminal-20261030]
    paths:
      - "YMOriginal/Original24_ConnectedUrsellFP.lean"
      - "YMOriginal/Original24_FromPublishedU1ConnectedFP.lean"
      - "YMOriginal/Original24_ConnectedRootDistance.lean"
      - "YMOriginal/Original24_FromPublishedU1ConnectedB10.lean"
      - "YMOriginal/Original24_FixedTemplateConnected.lean"
      - "YMOriginal/Original24_ActualHardCoreGraph.lean"
      - "YMOriginal/Original24_PeriodicHardCoreEquivalence.lean"
      - "YMOriginal/Original24_FiniteMayerUrsell.lean"
      - "YMOriginal/Original24_ExactExtendedTwoRootMayer.lean"
      - "YMOriginal/Original24_PublishedPenroseExtended.lean"
      - "YMOriginal/Original24_ExactExtendedWeighted.lean"
      - "YMOriginal/Original24_CorrectedRootForest.lean"
      - "YMOriginal/Original24_PublishedPenroseExtended.lean"
      - "YMOriginal/Original24_ExactExtendedWeighted.lean"
      - "YMOriginal/Original24_ConnectedWilsonB10.lean"
      - ".github/workflows/ym-original24-fp-terminal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original24-connected:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Lock Mathlib and download compiled cache
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Exact theorem environment build
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YMOriginal/Original24_ConnectedUrsellFP.lean; then exit 1; fi
          lake build +YMOriginal.Original24_ConnectedUrsellFP:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ConnectedUrsellFP.lean
          lake build +YMOriginal.Original24_FromPublishedU1ConnectedFP:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_FromPublishedU1ConnectedFP.lean
          lake build +YMOriginal.Original24_ConnectedRootDistance:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ConnectedRootDistance.lean
          lake build +YMOriginal.Original24_FromPublishedU1ConnectedB10:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_FromPublishedU1ConnectedB10.lean
          lake build +YMOriginal.Original24_FixedTemplateConnected:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_FixedTemplateConnected.lean
          lake build +YMOriginal.Original24_ActualHardCoreGraph:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ActualHardCoreGraph.lean
          lake build +YMOriginal.Original24_PeriodicHardCoreEquivalence:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_PeriodicHardCoreEquivalence.lean
          lake build +YMOriginal.Original24_FiniteMayerUrsell:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_FiniteMayerUrsell.lean
          lake build +YMOriginal.Original24_ExactExtendedTwoRootMayer:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ExactExtendedTwoRootMayer.lean
          lake build +YMOriginal.Original24_PublishedPenroseExtended:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_PublishedPenroseExtended.lean
          lake build +YMOriginal.Original24_ExactExtendedWeighted:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ExactExtendedWeighted.lean
          lake build +YMOriginal.Original24_CorrectedRootForest:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_CorrectedRootForest.lean
          lake build +YMOriginal.Original24_PublishedPenroseExtended:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_PublishedPenroseExtended.lean
          lake build +YMOriginal.Original24_ExactExtendedWeighted:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ExactExtendedWeighted.lean

          lake build +YMOriginal.Original24_ConnectedWilsonB10:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ConnectedWilsonB10.lean
      - name: Print full types and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/original24-fp-terminal
          cat > verification/original24-fp-terminal/Audit.lean <<'LEAN'
          import YMOriginal.Original24_FromPublishedU1ConnectedFP
          import YMOriginal.Original24_ConnectedWilsonB10
          import YMOriginal.Original24_ConnectedUrsellFP
          import YMOriginal.Original24_ConnectedRootDistance
          import YMOriginal.Original24_FromPublishedU1ConnectedB10
          import YMOriginal.Original24_FixedTemplateConnected
          import YMOriginal.Original24_ActualHardCoreGraph
          import YMOriginal.Original24_PeriodicHardCoreEquivalence
          import YMOriginal.Original24_FiniteMayerUrsell
          import YMOriginal.Original24_ExactExtendedTwoRootMayer
          import YMOriginal.Original24_PublishedPenroseExtended
          import YMOriginal.Original24_ExactExtendedWeighted
          import YMOriginal.Original24_CorrectedRootForest
          import YMOriginal.Original24_ExactExtendedWeighted
          set_option pp.universes true
          #print YMUIC.Original24.original24_connected_ursell_from_periodic_FP
          #print YMUIC.Original24.original24_actual_two_root_connected_ursell
          #print axioms YMUIC.Original24.original24_connected_ursell_from_periodic_FP
          #print axioms YMUIC.Original24.original24_actual_two_root_connected_ursell
          #print YMUIC.Original24.original24_real_U1_old_new_local_norm
          #print YMUIC.Original24.original24_real_U1_old_new_connected_Wilson
          #print axioms YMUIC.Original24.original24_real_U1_old_new_local_norm
          #print axioms YMUIC.Original24.original24_real_U1_old_new_connected_Wilson
          #print YMUIC.Original24.original24_connected_ursell_root_distance
          #print YMUIC.Original24.original24_two_root_connected_distance
          #print axioms YMUIC.Original24.original24_connected_ursell_root_distance
          #print axioms YMUIC.Original24.original24_two_root_connected_distance
          #print YMUIC.Original24.original24_balaban_old_new_connected_B10
          #print axioms YMUIC.Original24.original24_balaban_old_new_connected_B10
          #print YMUIC.Original24.original24_fixed_template_connected_distance
          #print axioms YMUIC.Original24.original24_fixed_template_connected_distance
          #print axioms YMUIC.Original24.actual_periodic_hardcore_species_adj
          #print axioms YMUIC.Original24.actual_periodic_labeled_hardcore_adj
          #print axioms YMUIC.Original24.actual_periodic_mayer_bond_symm
          #print axioms YMUIC.Original24.actual_periodic_labeled_mayer_edge
          #print axioms YMUIC.Original24.four_dim_periodic_neighborhood_symm
          #print axioms YMUIC.Original24.actual_periodic_polymer_children_symm
          #print axioms YMUIC.Original24.actual_hardcore_graph_adj_iff_U2_child
          #print YMUIC.Original24.actualPeriodicConnectedMayerCoefficient
          #print YMUIC.Original24.actualBalabanOldRConnectedMayerTerm
          #print YMUIC.Original24.actualBalabanNewRConnectedMayerTerm
          #print axioms YMUIC.Original24.actual_periodic_connected_mayer_zero_of_disconnected
          #print axioms YMUIC.Original24.actual_periodic_connected_mayer_abs_le_graph_count
          #print YMUIC.Original24.actualExactTwoRootGraph
          #print YMUIC.Original24.actualExactTwoRootMayerTerm
          #print YMUIC.Original24.actualExactBalabanOldRTwoRootTerm
          #print YMUIC.Original24.actualExactBalabanNewRTwoRootTerm
          #print axioms YMUIC.Original24.actual_exact_two_root_no_root_bond
          #print axioms YMUIC.Original24.actual_exact_rootp_bulk_edge
          #print axioms YMUIC.Original24.actual_exact_rootq_bulk_edge
          #print axioms YMUIC.Original24.actual_exact_bulk_bulk_edge
          #print axioms YMUIC.Original24.actual_exact_two_root_ursell_zero_of_disconnected
          #print YMUIC.Original24.PublishedPenroseExtendedTwoRoot
          #print axioms YMUIC.Original24.actual_exact_extended_penrose
          #print YMUIC.Original24.actual_exact_extended_two_root_penrose_weighted
          #print axioms YMUIC.Original24.actual_exact_extended_two_root_penrose_weighted
          #print YMUIC.Original24.actual_exact_balaban_old_new_marked_penrose
          #print axioms YMUIC.Original24.actual_exact_balaban_old_new_marked_penrose
          #print axioms YMUIC.Original24.original24_exp_forest_le
          #print YMUIC.Original24.actual_periodic_full_root_forest_from_U1
          #print axioms YMUIC.Original24.actual_periodic_full_root_forest_from_U1
          #print YMUIC.Original24.PublishedPenroseExtendedTwoRoot
          #print axioms YMUIC.Original24.actual_exact_extended_ursell_eq_graph_sum
          #print axioms YMUIC.Original24.actual_exact_extended_penrose
          #print YMUIC.Original24.actual_exact_balaban_old_new_marked_penrose
          #print axioms YMUIC.Original24.actual_exact_extended_two_root_penrose_weighted
          #print axioms YMUIC.Original24.actual_exact_extended_marked_penrose
          #print axioms YMUIC.Original24.actual_exact_balaban_old_new_marked_penrose
          LEAN
          lake env lean -DwarningAsError=true verification/original24-fp-terminal/Audit.lean | tee verification/original24-fp-terminal/axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/original24-fp-terminal/axioms.log; then exit 1; fi
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-original24-connected-ursell-fp
          path: verification/original24-fp-terminal/axioms.log
          if-no-files-found: warn
          retention-days: 21
