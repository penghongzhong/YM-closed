name: YM Original24 double-fugacity nonempty-bulk two-root LEAP
on:
  push:
    branches: [ym-original24-double-fugacity-20261030]
    paths:
      - "YMOriginal/Original24_DoubleFugacitySelection.lean"
      - "YMOriginal/Original24_ExplicitTwoFugacityKP.lean"
      - "YMOriginal/Original24_DoubleFugacityFPTerminal.lean"
      - ".github/workflows/ym-original24-double-fugacity.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  double-fugacity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fixed Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Mathlib exact SHA and cache
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Strict Lean kernel and warnings
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          for f in YMOriginal/Original24_DoubleFugacitySelection.lean YMOriginal/Original24_ExplicitTwoFugacityKP.lean YMOriginal/Original24_DoubleFugacityFPTerminal.lean; do
            if [ -f "$f" ]; then
              if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' "$f"; then exit 1; fi
              lake build +$(echo "$f" | sed -e 's@/@.@g' -e 's@\.lean$@@'):olean
              lake env lean -DwarningAsError=true "$f"
            fi
          done
      - name: Proof type and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/original24-double-fugacity
          {
            echo "import YMOriginal.Original24_DoubleFugacitySelection"
            if [ -f YMOriginal/Original24_ExplicitTwoFugacityKP.lean ]; then
              echo "import YMOriginal.Original24_ExplicitTwoFugacityKP"
            fi
            if [ -f YMOriginal/Original24_DoubleFugacityFPTerminal.lean ]; then
              echo "import YMOriginal.Original24_DoubleFugacityFPTerminal"
            fi
            echo "#print YMUIC.Original24.one_q_nonempty_bulk_le_double_fugacity"
            echo "#print YMUIC.Original24.one_q_nonempty_bulk_from_doped_majorant"
            echo "#print axioms YMUIC.Original24.one_q_nonempty_bulk_le_double_fugacity"
            echo "#print axioms YMUIC.Original24.one_q_nonempty_bulk_from_doped_majorant"
            if [ -f YMOriginal/Original24_ExplicitTwoFugacityKP.lean ]; then
              echo "#print YMUIC.Original24.original24_explicit_double_fugacity_margin"
              echo "#print axioms YMUIC.Original24.original24_explicit_double_fugacity_margin"
              echo "#print YMUIC.Original24.original24_actual_double_fugacity_root_forest_from_U1"
              echo "#print axioms YMUIC.Original24.original24_actual_double_fugacity_root_forest_from_U1"
            fi
            if [ -f YMOriginal/Original24_DoubleFugacityFPTerminal.lean ]; then
              echo "#print YMUIC.Original24.original24_two_root_tree_O_aAct_from_U1_and_FP"
              echo "#print axioms YMUIC.Original24.original24_two_root_tree_O_aAct_from_U1_and_FP"
            fi
          } > verification/original24-double-fugacity/Audit.lean
          lake env lean -DwarningAsError=true verification/original24-double-fugacity/Audit.lean | tee verification/original24-double-fugacity/axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/original24-double-fugacity/axioms.log; then exit 1; fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original24-double-fugacity-strict
          path: verification/original24-double-fugacity/axioms.log
          if-no-files-found: warn
