name: Original24 true 4D Schwartz source B10 all-scale terminal
on:
  push:
    branches: [ym-original24-source-tail-native-20261031]
    paths:
      - "YMOriginal/Original24_TrueSchwartzScaleTail.lean"
      - ".github/workflows/ym-original24-true-b10-terminal.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Official Lean exact pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Mathlib exact SHA and cache
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Strict actual-source fifth-order and all-scale build
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          f=YMOriginal/Original24_TrueSchwartzScaleTail.lean
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' "$f"; then exit 1; fi
          lake build +YMOriginal.Original24_TrueSchwartzScaleTail:olean
          lake env lean -DwarningAsError=true "$f"
      - name: Full exact terminal type and kernel axioms
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/original24-true-schwartz-tail
          cat > verification/original24-true-schwartz-tail/Audit.lean <<'LEAN'
          import YMOriginal.Original24_TrueSchwartzScaleTail
          set_option pp.universes true
          #print YMUIC.Original24.original24_real_connected_schwartz_postR_all_scales
          #print axioms YMUIC.Original24.original24_real_connected_schwartz_postR_all_scales
          LEAN
          lake env lean -DwarningAsError=true verification/original24-true-schwartz-tail/Audit.lean | tee verification/original24-true-schwartz-tail/axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/original24-true-schwartz-tail/axioms.log; then exit 1; fi
      - name: Save exact terminal proof audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original24-true-schwartz-postR-all-scale-axioms
          path: verification/original24-true-schwartz-tail/axioms.log
          if-no-files-found: warn
