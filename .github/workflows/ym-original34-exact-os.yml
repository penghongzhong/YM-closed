name: YM Original34 corrected OS II external-theorem manuscript audit

on:
  push:
    branches: [ym-original34-exact-os-20261030]
    paths:
      - "YMOriginal/Original34_*"
      - "YMOriginal/Original30_AnalyticToE0prime.lean"
      - "YMOriginal/Original30_ActualWordSmearing.lean"
      - "YMOriginal/Original30_ActualWordPhysicalBox.lean"
      - "YMOriginal/Original24_LocalGaugeInvariance.lean"
      - "YM/Wilson/WeightedSmearing.lean"
      - "YM/Wilson/FixedBoxSmearing.lean"
      - ".github/workflows/ym-original34-exact-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  os-conditional-original34:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official locked Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          source "$HOME/.elan/env"
          lean --version
      - name: Pin mathlib and obtain OLean
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Compile exact original environment 34 source
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YMOriginal/Original34_*.lean; then exit 1; fi
          lake build +YMOriginal.Original34_ManuscriptReconstruction:olean +YMOriginal.Original30_AnalyticToE0prime:olean +YMOriginal.Original30_ActualWordPhysicalBox:olean +YMOriginal.Original24_LocalGaugeInvariance:olean
          lake env lean -DwarningAsError=true YMOriginal/Original34_ManuscriptReconstruction.lean
          lake env lean -DwarningAsError=true YMOriginal/Original30_AnalyticToE0prime.lean
          lake env lean -DwarningAsError=true YMOriginal/Original30_ActualWordSmearing.lean
          lake env lean -DwarningAsError=true YMOriginal/Original30_ActualWordPhysicalBox.lean
          lake env lean -DwarningAsError=true YMOriginal/Original24_LocalGaugeInvariance.lean
      - name: Original theorem type and exact axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cat > Original34ExactAudit.lean <<'LEAN'
          import YMOriginal.Original34_ManuscriptReconstruction
          import YMOriginal.Original30_AnalyticToE0prime
          import YMOriginal.Original30_ActualWordSmearing
          import YMOriginal.Original30_ActualWordPhysicalBox
          import YMOriginal.Original24_LocalGaugeInvariance
          set_option pp.universes true
          #print YMUIC.Original24.actual_wilson_polynomial_gauge_invariant
          #print YMUIC.Original30.actual_word_box_smearing_bound
          #print YMUIC.Original30.actual_word_box_smearing_all_regulators
          #print YMUIC.Original30.actual_word_schwartz_smearing_bound
          #print YMUIC.Original30.actual_word_schwartz_smearing_all_regulators
          #print YMUIC.Original30.JointSourceAnalyticCertificate
          #print YMUIC.Original30.joint_source_analytic_implies_os_E0prime
          #print YMUIC.Original34.OS_E0prime
          #print YMUIC.Original34.OSSchwingerAxioms
          #print YMUIC.Original34.Original34ManuscriptInputs
          #print YMUIC.Original34.PublishedOSII
          #print YMUIC.Original34.original34_manuscript_axioms_iff
          #print YMUIC.Original34.original34_manuscript_reconstruction
          #print axioms YMUIC.Original24.wilson_root_conjugation_invariant
          #print axioms YMUIC.Original24.wilson_word_holonomy_conjugation
          #print axioms YMUIC.Original24.wilson_word_root_conjugation_invariant
          #print axioms YMUIC.Original24.actual_wilson_monomial_gauge_invariant
          #print axioms YMUIC.Original24.actual_wilson_polynomial_gauge_invariant
          #print axioms YMUIC.Original30.actual_word_box_smearing_bound
          #print axioms YMUIC.Original30.actual_word_box_smearing_all_regulators
          #print axioms YMUIC.Original30.actual_word_schwartz_smearing_bound
          #print axioms YMUIC.Original30.actual_word_schwartz_smearing_all_regulators
          #print axioms YMUIC.Original30.joint_source_analytic_implies_os_E0prime
          #print axioms YMUIC.Original34.original34_os_reconstruction_external_interface
          #print axioms YMUIC.Original34.original34_manuscript_axioms_iff
          #print axioms YMUIC.Original34.original34_manuscript_reconstruction
          LEAN
          lake env lean -DwarningAsError=true Original34ExactAudit.lean | tee original34-exact-audit.log
          if grep -E 'sorryAx|^error:' original34-exact-audit.log; then exit 1; fi
      - name: Retain strict log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-original34-exact-${{ github.sha }}
          path: original34-exact-audit.log
          if-no-files-found: warn
          retention-days: 30
