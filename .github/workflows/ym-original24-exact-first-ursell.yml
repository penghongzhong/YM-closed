name: Original24 actual one-polymer two-Wilson-root Ursell coefficient strict
on:
  push:
    branches: [ym-original24-onebulk-ursell-20261031]
    paths:
      - "YMOriginal/Original24_ExactFirstUrsell.lean"
      - "YMOriginal/Original24_ExactFirstMayerKP.lean"
      - ".github/workflows/ym-original24-exact-first-ursell.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-ursell:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Exact official Lean pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Exact pinned Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: True source Ursell exact coefficient and strict build
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          for f in YMOriginal/Original24_ExactFirstUrsell.lean YMOriginal/Original24_ExactFirstMayerKP.lean; do
            if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' "$f"; then exit 1; fi
          done
          lake build +YMOriginal.Original24_ExactFirstMayerKP:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ExactFirstUrsell.lean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ExactFirstMayerKP.lean
      - name: Exact full terminal type and axioms
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/original24-onebulk
          cat > verification/original24-onebulk/Audit.lean <<'LEAN'
          import YMOriginal.Original24_ExactFirstMayerKP
          set_option pp.universes true
          #print YMUIC.Original24.original24_exact_connected_graph_sum_of_tree
          #print axioms YMUIC.Original24.original24_exact_connected_graph_sum_of_tree
          #print YMUIC.Original24.original24_actual_one_bulk_graph_eq_star
          #print axioms YMUIC.Original24.original24_actual_one_bulk_graph_eq_star
          #print YMUIC.Original24.original24_exact_one_bulk_ursell_eq_bridge_indicator
          #print axioms YMUIC.Original24.original24_exact_one_bulk_ursell_eq_bridge_indicator
          #print YMUIC.Original24.original24_exact_first_mayer_eq_bridge_sum
          #print axioms YMUIC.Original24.original24_exact_first_mayer_eq_bridge_sum
          #print YMUIC.Original24.original24_exact_first_mayer_from_KP
          #print axioms YMUIC.Original24.original24_exact_first_mayer_from_KP
          LEAN
          lake env lean -DwarningAsError=true verification/original24-onebulk/Audit.lean | tee verification/original24-onebulk/axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/original24-onebulk/axioms.log; then exit 1; fi
      - name: Save axioms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original24-exact-onebulk-ursell-axioms
          path: verification/original24-onebulk/axioms.log
          if-no-files-found: warn
