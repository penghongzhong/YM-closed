name: YM Original24 real one-q adjacency and factorial dictionary
on:
  push:
    branches: [ym-original24-unique-q-fp-dictionary-20261030]
    paths:
      - "YMOriginal/Original24_ExactAugmentedQContact.lean"
      - "YMOriginal/Original24_UniqueQFactorial.lean"
      - ".github/workflows/ym-original24-q-fp-dictionary.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  q-dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Official Lean pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Official Mathlib pin and cache
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Kernel compile and warning-as-error
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          for module in YMOriginal.Original24_ExactAugmentedQContact YMOriginal.Original24_UniqueQFactorial; do
            f="$(echo "$module" | tr . /).lean"
            if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' "$f"; then exit 1; fi
            lake build "+$module:olean"
            lake env lean -DwarningAsError=true "$f"
          done
      - name: Exact theorem type and axioms audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/original24-q-fp
          cat > verification/original24-q-fp/Audit.lean <<'LEAN'
          import YMOriginal.Original24_ExactAugmentedQContact
          import YMOriginal.Original24_UniqueQFactorial
          set_option pp.universes true
          #print YMUIC.Original24.actual_augmented_bulk_children_iff_original
          #print YMUIC.Original24.actual_augmented_second_root_bulk_contact_iff
          #print YMUIC.Original24.actual_augmented_pq_contact_iff
          #print YMUIC.Original24.original24_unique_second_root_factorial
          #print YMUIC.Original24.original24_symmetric_unique_q_label_factorial
          #print axioms YMUIC.Original24.actual_augmented_bulk_children_iff_original
          #print axioms YMUIC.Original24.actual_augmented_second_root_bulk_contact_iff
          #print axioms YMUIC.Original24.actual_augmented_pq_contact_iff
          #print axioms YMUIC.Original24.original24_unique_second_root_factorial
          #print axioms YMUIC.Original24.original24_symmetric_unique_q_label_factorial
          LEAN
          lake env lean -DwarningAsError=true verification/original24-q-fp/Audit.lean | tee verification/original24-q-fp/axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/original24-q-fp/axioms.log; then exit 1; fi
      - name: Save receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-original24-unique-q-physical-fp-dictionary
          path: verification/original24-q-fp/axioms.log
          if-no-files-found: warn
