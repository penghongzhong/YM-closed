name: YM Original24 exact two-root connected hard-core graph attachment
on:
  push:
    branches: [ym-original24-two-root-graph-obstruction-20261030]
    paths:
      - "YMOriginal/Original24_ExactTwoRootAttachment.lean"
      - "YMOriginal/Original24_TwoRootHubLemma.lean"
      - ".github/workflows/ym-original24-exact-attachment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-root-attachment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install official Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Official pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: True kernel compilation
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YMOriginal/Original24_ExactTwoRootAttachment.lean; then exit 1; fi
          lake build +YMOriginal.Original24_ExactTwoRootAttachment:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_ExactTwoRootAttachment.lean
          lake build +YMOriginal.Original24_TwoRootHubLemma:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_TwoRootHubLemma.lean
      - name: Full theorem statement and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/original24-exact-attachment
          cat > verification/original24-exact-attachment/Audit.lean <<'LEAN'
          import YMOriginal.Original24_ExactTwoRootAttachment
          import YMOriginal.Original24_TwoRootHubLemma
          set_option pp.universes true
          #print YMUIC.Original24.actual_exact_connected_has_two_root_contacts
          #print YMUIC.Original24.actual_exact_two_root_graph_zero_bulk_disconnected
          #print YMUIC.Original24.actual_exact_two_root_mayer_zero_bulk
          #print YMUIC.Original24.actual_exact_two_root_mayer_zero_without_p_contact
          #print axioms YMUIC.Original24.actual_exact_connected_has_two_root_contacts
          #print axioms YMUIC.Original24.actual_exact_two_root_graph_zero_bulk_disconnected
          #print axioms YMUIC.Original24.actual_exact_two_root_mayer_zero_bulk
          #print axioms YMUIC.Original24.actual_exact_two_root_mayer_zero_without_p_contact
          #print YMUIC.Original24.actual_two_root_extended_connected_by_q_hub
          #print YMUIC.Original24.actual_two_root_hub_not_bulk_connected
          #print axioms YMUIC.Original24.actual_two_root_extended_connected_by_q_hub
          #print axioms YMUIC.Original24.actual_two_root_hub_not_bulk_connected
          LEAN
          lake env lean -DwarningAsError=true verification/original24-exact-attachment/Audit.lean | tee verification/original24-exact-attachment/axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/original24-exact-attachment/axioms.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original24-exact-attachment-proof
          path: verification/original24-exact-attachment/axioms.log
          if-no-files-found: warn
