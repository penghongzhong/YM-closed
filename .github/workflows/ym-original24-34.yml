name: YM Original24 genuine Wilson marked old-new R strict Lean audit

on:
  push:
    branches: [ym-original24-34-i7-20261030]
    paths:
      - "YMOriginal/**"
      - ".github/workflows/ym-original24-34.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original24-and-os-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Lock mathlib and load OLean caches
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Compile genuine SU2 composite-root old/new R module
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YMOriginal/*.lean; then exit 1; fi
          lake build +YMOriginal.Original24_MarkedRootBridge:olean +YMOriginal.Original34_OSII_ExternalInterface:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_MarkedRootBridge.lean
          lake env lean -DwarningAsError=true YMOriginal/Original34_OSII_ExternalInterface.lean
      - name: Print every source theorem premise and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cat > Original24Audit.lean <<'LEAN'
          import YMOriginal.Original24_MarkedRootBridge
          import YMOriginal.Original34_OSII_ExternalInterface
          #print YMUIC.Original34.original34_os_reconstruction_external_interface
          #print YMUIC.Original24.one_root_tree_sum
          #print YMUIC.Original24.composite_r_marked_tree_sum
          #print YMUIC.Original24.composite_old_new_r_marked
          #print axioms YMUIC.Original34.original34_os_reconstruction_external_interface
          #print axioms YMUIC.Original24.one_root_tree_sum
          #print axioms YMUIC.Original24.composite_r_marked_tree_sum
          #print axioms YMUIC.Original24.composite_old_new_r_marked
          LEAN
          lake env lean -DwarningAsError=true Original24Audit.lean | tee original24-audit.log
          if grep -E 'sorryAx|^error:' original24-audit.log; then exit 1; fi
      - name: Keep strict audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-original24-bridge-${{ github.sha }}
          path: original24-audit.log
          if-no-files-found: warn
          retention-days: 30
