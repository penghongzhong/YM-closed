name: YM Original24 composite SU2 roots (Lean 4.35 strict pin)

on:
  push:
    branches: [ym-original24-30-rooted-poly-20261030]
    paths:
      - "YM/Wilson/CompositeWordPolynomial24.lean"
      - "YM/OSGrowth/Moments.lean"
      - "YM/OSGrowth/Polymer.lean"
      - "YM/OSGrowth/PolynomialRadiusBound.lean"
      - "YM/OSGrowth/PolynomialMomentGrowth.lean"
      - "YM/OSGrowth/Original30PolynomialPolymerGrowth.lean"
      - ".github/workflows/ym-original24-30-rooted-poly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original24-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Locked Mathlib
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Compile full Original24 root dependency
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YM/Wilson/CompositeWordPolynomial24.lean; then exit 1; fi
          lake build +YM.Wilson.CompositeWordPolynomial24:olean
          lake env lean -DwarningAsError=true YM/Wilson/CompositeWordPolynomial24.lean
          lake build +YM.OSGrowth.Original30PolynomialPolymerGrowth:olean
          lake env lean -DwarningAsError=true YM/OSGrowth/Original30PolynomialPolymerGrowth.lean
      - name: Audit complete theorem statements and axioms
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cat > /tmp/Original24Audit.lean <<'LEAN'
          import YM.Wilson.CompositeWordPolynomial24
          import YM.OSGrowth.Original30PolynomialPolymerGrowth
          set_option pp.universes true
          #print YMUIC.Wilson.wilson_word_polynomial_bound
          #print YMUIC.Wilson.wilson_word_external_root_all_regulators
          #print axioms YMUIC.Wilson.wilson_word_monomial_norm_le
          #print axioms YMUIC.Wilson.wilson_word_polynomial_budget_nonneg
          #print axioms YMUIC.Wilson.wilson_word_polynomial_bound
          #print axioms YMUIC.Wilson.wilson_word_external_root_small
          #print axioms YMUIC.Wilson.wilson_word_external_root_all_regulators
          #print YMUIC.OSGrowth.finite_polymer_polynomial_schwinger_growth
          #print axioms YMUIC.OSGrowth.finite_polymer_polynomial_schwinger_growth
          LEAN
          lake env lean -DwarningAsError=true /tmp/Original24Audit.lean | tee /tmp/original24-axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' /tmp/original24-axioms.log; then exit 1; fi
      - name: Evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-original24-root-axioms
          path: /tmp/original24-axioms.log
          if-no-files-found: warn
          retention-days: 14
