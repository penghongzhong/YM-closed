name: YM Original24 native U1 shell count strict Lean
on:
  push:
    branches: [ym-original24-native-shell-20261030]
    paths:
      - "YMOriginal/Original24_NativeShellU1.lean"
      - "YMOriginal/Original24_BalabanNativeShellRealSeries.lean"
      - ".github/workflows/ym-original24-native-shell.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  native-u1-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Real kernel validation
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          f=YMOriginal/Original24_NativeShellU1.lean
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' "$f"; then exit 1; fi
          lake build +YMOriginal.Original24_NativeShellU1:olean
          lake env lean -DwarningAsError=true "$f"
          if [ -f YMOriginal/Original24_BalabanNativeShellRealSeries.lean ]; then
            f=YMOriginal/Original24_BalabanNativeShellRealSeries.lean
            if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' "$f"; then exit 1; fi
            lake build +YMOriginal.Original24_BalabanNativeShellRealSeries:olean
            lake env lean -DwarningAsError=true "$f"
          fi
      - name: Full original24 U1 shell theorem audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/original24-native-shell
          {
            echo "import YMOriginal.Original24_NativeShellU1"
            if [ -f YMOriginal/Original24_BalabanNativeShellRealSeries.lean ]; then
              echo "import YMOriginal.Original24_BalabanNativeShellRealSeries"
            fi
            echo "#print YMUIC.Original24.actual_native_U1_shell_count_to_block_norm"
            echo "#print axioms YMUIC.Original24.actual_native_U1_shell_count_to_block_norm"
            if [ -f YMOriginal/Original24_BalabanNativeShellRealSeries.lean ]; then
              echo "#print YMUIC.Original24.original24_balaban_native_shell_full_series"
              echo "#print axioms YMUIC.Original24.original24_balaban_native_shell_full_series"
            fi
          } > verification/original24-native-shell/Audit.lean
          lake env lean -DwarningAsError=true verification/original24-native-shell/Audit.lean | tee verification/original24-native-shell/axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/original24-native-shell/axioms.log; then exit 1; fi
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-original24-native-shell-proof
          path: verification/original24-native-shell/axioms.log
          if-no-files-found: warn
