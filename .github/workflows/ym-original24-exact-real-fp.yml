name: Original24 true n+2 Wilson Mayer FP full-series LEAP
on:
  push:
    branches: [ym-original24-real-two-root-fp-20261030]
    paths:
      - "YMOriginal/Original24_ExactRealTwoRootFPSeries.lean"
      - "YMOriginal/Original24_BalabanTwoRootRealFullSeries.lean"
      - ".github/workflows/ym-original24-exact-real-fp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original24-real-fp:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Pinned official Lean 4.35
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Pinned Mathlib and cache
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Real kernel proof and warning-as-error
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          f=YMOriginal/Original24_ExactRealTwoRootFPSeries.lean
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' "$f"; then exit 1; fi
          lake build +YMOriginal.Original24_ExactRealTwoRootFPSeries:olean
          lake env lean -DwarningAsError=true "$f"
          lake build +YMOriginal.Original24_BalabanTwoRootRealFullSeries:olean
          lake env lean -DwarningAsError=true YMOriginal/Original24_BalabanTwoRootRealFullSeries.lean
      - name: Root theorem type and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/real-two-root-fp
          cat > verification/real-two-root-fp/Audit.lean <<'LEAN'
          import YMOriginal.Original24_ExactRealTwoRootFPSeries
          import YMOriginal.Original24_BalabanTwoRootRealFullSeries
          set_option pp.universes true
          #print YMUIC.Original24.PhysicalExactTwoRootFPCriterion
          #print YMUIC.Original24.actual_exact_two_root_positive_tree_weight
          #print YMUIC.Original24.actual_original24_two_root_mayer_full_sum_from_U1_FP
          #print axioms YMUIC.Original24.actual_exact_two_root_positive_tree_weight
          #print axioms YMUIC.Original24.actual_original24_two_root_mayer_full_sum_from_U1_FP
          #print YMUIC.Original24.original24_balaban_real_old_new_complete_two_root_series
          #print axioms YMUIC.Original24.original24_balaban_real_old_new_complete_two_root_series
          LEAN
          lake env lean -DwarningAsError=true verification/real-two-root-fp/Audit.lean | tee verification/real-two-root-fp/axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/real-two-root-fp/axioms.log; then exit 1; fi
      - name: Preserve proof audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original24-real-two-root-fp
          path: verification/real-two-root-fp/axioms.log
          retention-days: 21
          if-no-files-found: warn
