name: YM Original24 real 4D periodic KP finite-height U2 tree
on:
  push:
    branches: [ym-original24-link-wilson-20261030]
    paths:
      - "YMOriginal/Original24_PeriodicKPFiniteTree.lean"
      - "YMOriginal/Original24_PeriodicRootTreeLimit.lean"
      - ".github/workflows/ym-original24-kp-tree.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-kp-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official locked Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          source "$HOME/.elan/env"
          lean --version
      - name: Official locked Mathlib
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Compile physical 4D periodic KP
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YMOriginal/Original24_PeriodicKPFiniteTree.lean; then exit 1; fi
          lake build +YMOriginal.Original24_PeriodicRootTreeLimit:olean
          cat > KPTreeAudit.lean <<'LEAN'
          import YMOriginal.Original24_PeriodicRootTreeLimit
          #print YMUIC.Original24.actual_periodic_tree_height_mono
          #print YMUIC.Original24.actual_periodic_first_root_uniform
          #print YMUIC.Original24.actual_periodic_first_root_limit_exists_and_bounded
          #print YMUIC.Original24.actual_periodic_U1_to_U2_child_barrier
          #print YMUIC.Original24.actual_periodic_U2_tree_height_bound
          #print axioms YMUIC.Original24.actual_periodic_tree_height_mono
          #print axioms YMUIC.Original24.actual_periodic_first_root_uniform
          #print axioms YMUIC.Original24.actual_periodic_first_root_limit_exists_and_bounded
          #print axioms YMUIC.Original24.actual_periodic_U1_to_U2_child_barrier
          #print axioms YMUIC.Original24.actual_periodic_U2_tree_height_bound
          LEAN
          lake env lean -DwarningAsError=true KPTreeAudit.lean | tee kp-tree-audit.log
          if grep -E 'sorryAx|^error:' kp-tree-audit.log; then exit 1; fi
      - name: Upload proof and axiom record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original24-4d-kp-tree-${{ github.sha }}
          path: kp-tree-audit.log
          if-no-files-found: warn
          retention-days: 30
