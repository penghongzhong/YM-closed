name: YM Original30 actual Wilson SU2 source and 21D mixing (Lean 4.35 pin)

on:
  push:
    branches: [ym-original30-wilson-source-20261029]
    paths:
      - "YM/Wilson/**"
      - ".github/workflows/ym-original30-wilson-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-wilson-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Lock Mathlib and fetch official OLean cache
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Compile actual Wilson SU2 source dependency chain
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YM/Wilson/*.lean; then exit 1; fi
          lake build +YM.Wilson.SourceMix21:olean
          lake build +YM.Wilson.SourceCocycle21:olean
          lake build +YM.Wilson.SourceCocycleChain21:olean
          lake env lean -DwarningAsError=true YM/Wilson/RootBound.lean
          lake env lean -DwarningAsError=true YM/Wilson/SourceDirection.lean
          lake env lean -DwarningAsError=true YM/Wilson/SourceMix21.lean
          lake env lean -DwarningAsError=true YM/Wilson/SourceCocycle21.lean
          lake env lean -DwarningAsError=true YM/Wilson/SourceCocycleChain21.lean
      - name: Full theorem statements, premises, and axioms
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/original30-wilson
          cat >verification/original30-wilson/Audit.lean <<'LEAN'
          import YM.Wilson.SourceCocycleChain21
          set_option pp.universes true
          #print YMUIC.Wilson.wilson_plaquette_direction_uniform
          #print YMUIC.Wilson.mixed_wilson_direction_uniform
          #print YMUIC.Wilson.mixed_wilson_direction_all_regulators
          #print YMUIC.Wilson.mixed_wilson_two_step_uniform
          #print YMUIC.Wilson.wilson_source_of_summable_cocycle
          #print axioms YMUICV128.Section03.wilsonRoot_bounds
          #print axioms YMUIC.Wilson.wilson_plaquette_direction_pointwise
          #print axioms YMUIC.Wilson.wilson_plaquette_direction_uniform
          #print axioms YMUIC.Wilson.wilson_plaquette_direction_sub
          #print axioms YMUIC.Wilson.wilson_plaquette_direction_lipschitz
          #print axioms YMUIC.Wilson.wilson_plaquette_direction_all_regulators
          #print axioms YMUIC.Wilson.mixed_wilson_direction_pointwise
          #print axioms YMUIC.Wilson.mixed_wilson_direction_uniform
          #print axioms YMUIC.Wilson.mixed_wilson_direction_all_regulators
          #print axioms YMUIC.Wilson.source_cocycle_column_bound
          #print axioms YMUIC.Wilson.mixed_wilson_cocycle_action
          #print axioms YMUIC.Wilson.mixed_wilson_two_step_uniform
          #print axioms YMUIC.Wilson.source_cocycle_identity_column
          #print axioms YMUIC.Wilson.source_cocycle_chain_column
          #print axioms YMUIC.Wilson.source_cocycle_chain_uniform_column
          #print axioms YMUIC.Wilson.wilson_source_of_summable_cocycle
          LEAN
          lake env lean -DwarningAsError=true verification/original30-wilson/Audit.lean | tee verification/original30-wilson/audit.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/original30-wilson/audit.log; then exit 1; fi
      - name: Preserve source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-original30-wilson-source-${{ github.sha }}
          path: verification/original30-wilson/audit.log
          if-no-files-found: warn
          retention-days: 30
