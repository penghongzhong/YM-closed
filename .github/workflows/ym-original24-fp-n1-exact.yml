name: YM Original24 exact n1 physical Mayer KP coefficient
on:
  push:
    branches: [ym-original24-fp-n1-exact-20261031]
    paths:
      - "YMOriginal/Original24_FPFirstExactCoefficient.lean"
      - ".github/workflows/ym-original24-fp-n1-exact.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Exact official Lean pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          lean --version
      - name: Mathlib exact SHA and cache
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Strict actual exact n1 source coefficient
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          f=YMOriginal/Original24_FPFirstExactCoefficient.lean
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' "$f"; then exit 1; fi
          lake build +YMOriginal.Original24_FPFirstExactCoefficient:olean
          lake env lean -DwarningAsError=true "$f"
      - name: Exact full types and kernel axioms
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p verification/original24-n1
          cat > verification/original24-n1/Audit.lean <<'LEAN'
          import YMOriginal.Original24_FPFirstExactCoefficient
          set_option pp.universes true
          #print YMUIC.Original24.original24_one_bulk_exact_tree_count
          #print axioms YMUIC.Original24.original24_one_bulk_exact_tree_count
          #print YMUIC.Original24.original24_exact_first_tree_majorant_eq_bridge
          #print axioms YMUIC.Original24.original24_exact_first_tree_majorant_eq_bridge
          #print YMUIC.Original24.original24_exact_first_FP_coefficient_from_U1
          #print axioms YMUIC.Original24.original24_exact_first_FP_coefficient_from_U1
          LEAN
          lake env lean -DwarningAsError=true verification/original24-n1/Audit.lean | tee verification/original24-n1/axioms.log
          if grep -E 'sorryAx|^error:|YMUIC\.[^ ]+\.[^ ]+ : axiom' verification/original24-n1/axioms.log; then exit 1; fi
      - name: Save audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original24-physical-n1-axioms
          path: verification/original24-n1/axioms.log
          if-no-files-found: warn
