name: YM Original30 unbounded-volume one-dimensional cubature proof
on:
  push:
    branches: [ym-original24-link-wilson-20261030]
    paths:
      - "YMOriginal/Original30_OneDimCubature.lean"
      - "YMOriginal/Original30_FourDimCubature.lean"
      - "YMOriginal/Original30_SpatialLatticeGeometry.lean"
      - "YMOriginal/Original30_VolumeUniformWilsonSchwartz.lean"
      - ".github/workflows/ym-original30-cubature.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lattice-cubature:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.35.0-rc3"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          source "$HOME/.elan/env"
          lean --version
      - name: Load locked Mathlib
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "516d31250e96c4e8e76888c3d8e2e43a9642b9ee"
          lake exe cache get
      - name: Compile physical lattice cubature
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if grep -nE '^[[:space:]]*(sorry|admit|axiom|unsafe|partial)([[:space:]]|$)' YMOriginal/Original30_OneDimCubature.lean; then exit 1; fi
          lake build +YMOriginal.Original30_VolumeUniformWilsonSchwartz:olean
          cat > CubatureAudit.lean <<'LEAN'
          import YMOriginal.Original30_VolumeUniformWilsonSchwartz
          #print YMUIC.Original30.true_site_cubature_weight_identity
          #print YMUIC.Original30.actual_site_schwartz_cubature_point
          #print YMUIC.Original30.actual_spatial_wilson_uniform_unbounded_box
          #print YMUIC.Original30.true_site_coordinate_le_norm
          #print YMUIC.Original30.one_add_pow_eight_le
          #print YMUIC.Original30.true_site_product_weight_le_schwartz
          #print YMUIC.Original30.lattice_four_dimensional_uniform_all_cutoffs
          #print YMUIC.Original30.lattice_plaquette_four_dimensional_uniform
          #print YMUIC.Original30.lattice_inverse_square_telescope_step
          #print YMUIC.Original30.lattice_inverse_square_prefix
          #print YMUIC.Original30.lattice_inverse_square_uniform_all_cutoffs
          #print axioms YMUIC.Original30.true_site_cubature_weight_identity
          #print axioms YMUIC.Original30.actual_site_schwartz_cubature_point
          #print axioms YMUIC.Original30.actual_spatial_wilson_uniform_unbounded_box
          #print axioms YMUIC.Original30.true_site_coordinate_le_norm
          #print axioms YMUIC.Original30.one_add_pow_eight_le
          #print axioms YMUIC.Original30.true_site_product_weight_le_schwartz
          #print axioms YMUIC.Original30.lattice_one_dim_weight_nonneg
          #print axioms YMUIC.Original30.lattice_four_dimensional_uniform_all_cutoffs
          #print axioms YMUIC.Original30.lattice_plaquette_four_dimensional_uniform
          #print axioms YMUIC.Original30.lattice_inverse_square_telescope_step
          #print axioms YMUIC.Original30.lattice_inverse_square_prefix
          #print axioms YMUIC.Original30.lattice_inverse_square_uniform_all_cutoffs
          LEAN
          lake env lean -DwarningAsError=true CubatureAudit.lean | tee cubature-audit.log
          if grep -E 'sorryAx|^error:' cubature-audit.log; then exit 1; fi
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-original30-1d-cubature-${{ github.sha }}
          path: cubature-audit.log
          if-no-files-found: warn
          retention-days: 30
